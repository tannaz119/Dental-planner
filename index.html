<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dental Study OS</title>

<style>
:root{
--bg:#0f1419;
--card:#182028;
--accent:#4da3ff;
--text:#e6edf3;
--muted:#8b949e;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,system-ui;
background:var(--bg);
color:var(--text);
}

header{
padding:18px;
font-size:20px;
font-weight:600;
}

.container{
padding:16px;
padding-bottom:90px;
}

.card{
background:var(--card);
border-radius:14px;
padding:16px;
margin-bottom:14px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.big{
font-size:28px;
font-weight:700;
margin-top:8px;
}

button{
background:var(--accent);
border:none;
color:white;
padding:10px 14px;
border-radius:8px;
font-size:14px;
}

input,textarea{
width:100%;
padding:10px;
margin-top:8px;
border-radius:8px;
border:none;
background:#0f1419;
color:white;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
background:#11161c;
display:flex;
justify-content:space-around;
align-items:center;
border-top:1px solid #222;
}

.tab{
color:var(--muted);
font-size:13px;
}

color:white
